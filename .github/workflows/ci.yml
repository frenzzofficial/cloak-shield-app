name: CI
on:
  pull_request:
  push: { branches: [main] }
permissions:
  contents: read
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway Postgres: the auth flow suite runs against it too, which is the only way the
    # repository SQL (atomic lockout counter, token rotation, single-use links) is exercised.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cloak_shield_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/cloak_shield_test
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/cloak_shield_test
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run type-coverage
      - run: bun run arch
      - run: bun run knip
      - run: bun run spell
      - run: bun run secrets
      - run: bunx drizzle-kit push --force
      - run: bun run test:coverage
      - run: bun run build:check
      - run: bun run check:deploy
